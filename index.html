<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1943: The Battle of Midway - Stage Clear Arcade Animation</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --arcade-bg: #08080c;
      --cabinet-border: #222533;
      --crt-glow: rgba(0, 170, 255, 0.22);
      --gold: #ffcc00;
      --red: #ff3300;
      --cyan: #00e5ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--arcade-bg);
      background-image: 
        radial-gradient(circle at 50% 45%, #192038 0%, #050508 75%);
      color: #fff;
      font-family: 'Press Start 2P', 'Courier New', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow-x: hidden;
    }

    .arcade-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      max-width: 100%;
    }

    .marquee {
      background: linear-gradient(90deg, #1a0b00 0%, #4a1c00 50%, #1a0b00 100%);
      border: 3px solid #ff9900;
      border-radius: 8px;
      padding: 10px 24px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 136, 0, 0.4), inset 0 0 12px rgba(255, 204, 0, 0.3);
      width: 100%;
      max-width: 688px;
    }

    .marquee h1 {
      font-size: 16px;
      color: var(--gold);
      text-shadow: 2px 2px 0px #aa0000, 0 0 10px #ffcc00;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .marquee p {
      font-size: 9px;
      color: #ffd988;
      letter-spacing: 1px;
    }

    .crt-bezel {
      position: relative;
      background: #14161f;
      padding: 18px;
      border-radius: 22px;
      border: 4px solid #2e3244;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.85),
        0 0 35px var(--crt-glow),
        inset 0 0 18px #000;
    }

    .screen-container {
      position: relative;
      width: 672px;
      height: 768px;
      max-width: 88vw;
      max-height: 72vh;
      aspect-ratio: 224 / 256;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.9);
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    /* CRT Scanlines & Vignette Overlay */
    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(18, 16, 16, 0) 50%, 
          rgba(0, 0, 0, 0.32) 50%
        ),
        radial-gradient(
          circle at center,
          transparent 68%,
          rgba(0, 0, 0, 0.55) 100%
        );
      background-size: 100% 4px, 100% 100%;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .crt-overlay.off {
      opacity: 0;
    }

    /* Controls Bar */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      align-items: center;
      background: #12141d;
      border: 2px solid #2a2f45;
      border-radius: 10px;
      padding: 10px 14px;
      width: 100%;
      max-width: 688px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.5);
    }

    .btn {
      background: #23283d;
      color: #fff;
      border: 2px solid #454f78;
      border-bottom-width: 4px;
      border-radius: 6px;
      padding: 8px 11px;
      font-family: inherit;
      font-size: 9px;
      cursor: pointer;
      transition: all 0.1s;
      text-transform: uppercase;
    }

    .btn:hover {
      background: #2f3756;
      border-color: var(--cyan);
      color: var(--cyan);
    }

    .btn:active, .btn.active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      background: #1b3b4b;
      border-color: var(--gold);
      color: var(--gold);
    }

    .btn-coin {
      background: #5c1900;
      border-color: #ff6600;
      color: #ffcc00;
    }

    .btn-coin:hover {
      background: #7a2200;
      border-color: #ffcc00;
      color: #fff;
    }

    .status-hint {
      font-size: 9px;
      color: #8b95b8;
      text-align: center;
      line-height: 1.6;
    }

    .status-hint span {
      color: var(--gold);
    }
  </style>
</head>

  <script>
    // =========================================================================
    // 1943: THE BATTLE OF MIDWAY - ARCADE STAGE CLEAR & ENDING ENGINE
    // Native Arcade Resolution: 224 x 256 (Vertical Shooter Aspect)
    // =========================================================================

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // --- Sprite Atlas Coordinates from arcard.png (1000 x 515) ---

    // --- Web Audio Retro Arcade Synthesizer ---
    class ArcadeSound {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.bgmTimer = null;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTone(freq, duration, type = 'square', vol = 0.08, slideTo = null) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        if (slideTo) {
          osc.frequency.exponentialRampToValueAtTime(slideTo, now + duration);
        }

        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);

        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playExplosion(duration = 0.35, vol = 0.14) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;

        const bufferSize = this.ctx.sampleRate * duration;
        const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = this.ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(550, this.ctx.currentTime);
        filter.frequency.exponentialRampToValueAtTime(75, this.ctx.currentTime + duration);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

        noise.connect(filter);
        filter.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playPropellerWhoosh() {
        this.playTone(220, 0.45, 'sawtooth', 0.06, 75);
      }

      playCoin() {
        this.playTone(987.77, 0.08, 'square', 0.1);
        setTimeout(() => this.playTone(1318.51, 0.28, 'square', 0.1), 80);
      }

      playTick() {
        this.playTone(880, 0.03, 'square', 0.045);
      }

      playVictoryFanfare() {
        if (!this.enabled) return;
        const notes = [
          { f: 523.25, d: 0.13, t: 0 },    // C5
          { f: 659.25, d: 0.13, t: 150 },  // E5
          { f: 783.99, d: 0.13, t: 300 },  // G5
          { f: 1046.50, d: 0.30, t: 450 }, // C6
          { f: 783.99, d: 0.14, t: 800 },  // G5
          { f: 1046.50, d: 0.55, t: 960 }  // C6
        ];
        notes.forEach(n => {
          setTimeout(() => this.playTone(n.f, n.d, 'square', 0.08), n.t);
        });
      }
    }

    const sfx = new ArcadeSound();

    // --- Load & Chroma-Key Sprite Sheet ---
    let spriteCanvas = null;
    let assetsLoaded = false;
    let loadError = false;

    const rawImg = new Image();
    rawImg.onload = () => {
      const off = document.createElement('canvas');
      off.width = rawImg.width;
      off.height = rawImg.height;
      const octx = off.getContext('2d');
      octx.drawImage(rawImg, 0, 0);

      const imgData = octx.getImageData(0, 0, off.width, off.height);
      const data = imgData.data;
      // Top-left pixel is the chroma-key neon green (136, 255, 0)
      const keyR = data[0], keyG = data[1], keyB = data[2];

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i], g = data[i + 1], b = data[i + 2];
        if (Math.abs(r - keyR) <= 18 && Math.abs(g - keyG) <= 18 && Math.abs(b - keyB) <= 18) {
          data[i + 3] = 0;
        }
      }
      octx.putImageData(imgData, 0, 0);
      spriteCanvas = off;
      assetsLoaded = true;
    };

      loadError = true;

    // --- Helper Drawing Functions ---
    function drawSprite(sp, dx, dy, dw = sp.w, dh = sp.h, flipX = false) {
      if (!spriteCanvas || !sp) return;
      ctx.save();
      if (flipX) {
        ctx.translate(Math.round(dx + dw), Math.round(dy));
        ctx.scale(-1, 1);
        ctx.drawImage(spriteCanvas, sp.x, sp.y, sp.w, sp.h, 0, 0, dw, dh);
      } else {
        ctx.drawImage(spriteCanvas, sp.x, sp.y, sp.w, sp.h, Math.round(dx), Math.round(dy), dw, dh);
      }
      ctx.restore();
    }

    function drawArcadeText(text, x, y, color = '#ffffff', shadowColor = '#000000', align = 'left', size = 8) {
      ctx.save();
      ctx.font = `${size}px "Press Start 2P", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = 'top';
      if (shadowColor) {
        ctx.fillStyle = shadowColor;
        ctx.fillText(text, Math.round(x) + 1, Math.round(y) + 1);
      }
      ctx.fillStyle = color;
      ctx.fillText(text, Math.round(x), Math.round(y));
      ctx.restore();
    }

    // --- Particle & Explosion System ---
    const explosions = [];
    const embers = [];

    function spawnExplosion(x, y, maxR = 18) {
      explosions.push({
        x, y,
        r: 2,
        maxR,
        age: 0,
        life: 24 + Math.random() * 14
      });
      for (let i = 0; i < 4; i++) {
        embers.push({
          x, y,
          vx: (Math.random() - 0.5) * 2.2,
          vy: -0.6 - Math.random() * 1.8,
          age: 0,
          life: 30 + Math.random() * 25,
          color: Math.random() > 0.4 ? '#ffcc00' : '#ff4400'
        });
      }
    }

    function updateAndDrawParticles() {
      // Explosions (retro pixel rings/flashes)
      for (let i = explosions.length - 1; i >= 0; i--) {
        const ex = explosions[i];
        ex.age++;
        const progress = ex.age / ex.life;
        if (progress >= 1) {
          explosions.splice(i, 1);
          continue;
        }
        const curR = ex.maxR * Math.sin(progress * Math.PI);
        ctx.save();
        if (progress < 0.25) {
          ctx.fillStyle = '#ffffff';
        } else if (progress < 0.55) {
          ctx.fillStyle = '#ffdd00';
        } else if (progress < 0.8) {
          ctx.fillStyle = '#ff4400';
        } else {
          ctx.fillStyle = '#552211';
        }
        // Draw blocky pixel circle
        const step = 2;
        for (let py = -curR; py <= curR; py += step) {
          for (let px = -curR; px <= curR; px += step) {
            if (px * px + py * py <= curR * curR) {
              ctx.fillRect(Math.round(ex.x + px), Math.round(ex.y + py), step, step);
            }
          }
        }
        ctx.restore();
      }

      // Rising fire embers & smoke puffs
      for (let i = embers.length - 1; i >= 0; i--) {
        const em = embers[i];
        em.x += em.vx;
        em.y += em.vy;
        em.age++;
        if (em.age >= em.life) {
          embers.splice(i, 1);
          continue;
        }
        ctx.fillStyle = em.age > em.life * 0.65 ? '#444444' : em.color;
        ctx.fillRect(Math.round(em.x), Math.round(em.y), 2, 2);
      }
    }

    // --- Cutscene State Machine ---
    // Scenes:
    // 0: P-38 Victory Flyby over Clouds (frames 0..270)
    // 1: Enemy Carrier Sinking & Stats Tally (frames 0..420)
    // 2: Giant Bomber "Ayako" Crashing in Flames & Stats (frames 0..420)
    // 3: Final Victory Ending - US Flag, Crew Celebration, Airfield & Credits (frames 0..900)
    let autoPlay = true;
    let currentScene = 0;
    let sceneFrame = 0;
    let globalFrame = 0;
    let creditsCount = 3;
    let score = 284500;
    const highScore = 500000;

    // Animated stats counters for scenes 1 & 2
    let displayedRate = 0;
    let displayedBonus = 0;

    function setScene(index, isAuto = false) {
      currentScene = index;
      sceneFrame = 0;
      autoPlay = isAuto;
      explosions.length = 0;
      embers.length = 0;
      displayedRate = 0;
      displayedBonus = 0;

      // Update UI buttons
      document.querySelectorAll('.controls .btn[data-scene]').forEach(btn => {
        const attr = btn.getAttribute('data-scene');
        if (isAuto && attr === 'auto') {
          btn.classList.add('active');
        } else if (!isAuto && Number(attr) === index) {
          btn.classList.add('active');
        } else {
          btn.classList.remove('active');
        }
      });

      if (index === 0 || index === 3) {
        sfx.playVictoryFanfare();
      }
    }

    // --- HUD Top Bar (1P, HIGH SCORE, 2P) ---
    function drawArcadeHUD() {
      drawArcadeText('1UP', 12, 6, '#ff3300');
      drawArcadeText(String(score).padStart(7, '0'), 8, 16, '#ffffff');

      drawArcadeText('HI-SCORE', 80, 6, '#ffcc00');
      drawArcadeText(String(Math.max(score, highScore)).padStart(7, '0'), 84, 16, '#ffffff');

      drawArcadeText('CREDIT ' + String(creditsCount).padStart(2, '0'), 146, 244, '#00e5ff');
    }

    // =========================================================================
    // SCENE 0: P-38 LIGHTNING DRAMATIC FLYBY OVER CLOUDS
    // Uses skyClouds background + the 8 progressive P-38 banking sprites
    // =========================================================================
    const FLYBY_KEYFRAMES = [
      { frameIdx: 0, x: 42,  y: 108, dur: 22 },
      { frameIdx: 1, x: 64,  y: 100, dur: 22 },
      { frameIdx: 2, x: 88,  y: 94,  dur: 22 },
      { frameIdx: 3, x: 108, y: 88,  dur: 22 },
      { frameIdx: 4, x: 122, y: 82,  dur: 24 },
      { frameIdx: 5, x: 118, y: 74,  dur: 26 },
      { frameIdx: 6, x: 104, y: 60,  dur: 28 },
      { frameIdx: 7, x: 82,  y: 28,  dur: 42 }
    ];

    function renderScene0() {
      // Fill sky blue
      ctx.fillStyle = '#00a8f8';
      ctx.fillRect(0, 0, 224, 256);

      // Parallax scrolling cloud panel from sprite sheet
      const cloudScrollY = Math.min(32, sceneFrame * 0.14);
      drawSprite(SPRITES.skyClouds, 0, 32 + cloudScrollY);

      // Determine which P-38 sprite frame to show along the flyby curve
      let t = sceneFrame;
      let acc = 0;
      let activeKF = null;
      let nextKF = null;
      let localP = 0;

      for (let i = 0; i < FLYBY_KEYFRAMES.length; i++) {
        const kf = FLYBY_KEYFRAMES[i];
        if (t < acc + kf.dur) {
          activeKF = kf;
          nextKF = FLYBY_KEYFRAMES[Math.min(i + 1, FLYBY_KEYFRAMES.length - 1)];
          localP = (t - acc) / kf.dur;
          if (t === acc && (i === 4 || i === 7)) {
            sfx.playPropellerWhoosh();
          }
          break;
        }
        acc += kf.dur;
      }

      if (activeKF) {
        const sp = SPRITES.planes[activeKF.frameIdx];
        const px = activeKF.x + (nextKF.x - activeKF.x) * localP;
        const py = activeKF.y + (nextKF.y - activeKF.y) * localP;
        drawSprite(sp, px, py);
      } else {
        // Plane swoops off to the right after close-up
        const overT = t - acc;
        if (overT < 35) {
          const sp = SPRITES.planes[7];
          drawSprite(sp, 82 + overT * 4.5, 28 - overT * 2.2);
        }
      }

      // Arcade mission text overlay
      if (sceneFrame > 20) {
        drawArcadeText('SURFACE FORCES', 112, 42, '#ffcc00', '#000000', 'center');
        drawArcadeText('CONFIRMED DESTROYED!', 112, 56, '#ffffff', '#000000', 'center');
      }
      if (sceneFrame > 130) {
        drawArcadeText('RETURNING TO BASE...', 112, 212, '#00ffff', '#000000', 'center');
      }

      drawArcadeHUD();

      if (autoPlay && sceneFrame >= 260) {
        setScene(1, true);
      }
    }

    // =========================================================================
    // SCENE 1: ENEMY CARRIER INFERNO (OFFENSIVE TARGET DESTROYED)
    // Uses carrierBurning panel + animated wave shimmer, explosions & tally
    // =========================================================================
    function renderScene1() {
      // Slight screen shake during explosions
      const shakeX = sceneFrame < 190 ? Math.sin(sceneFrame * 0.9) * 1.5 : 0;
      const shakeY = sceneFrame < 190 ? Math.cos(sceneFrame * 1.2) * 1.2 : 0;

      ctx.save();
      ctx.translate(Math.round(shakeX), Math.round(shakeY));

      // Draw burning aircraft carrier panel
      drawSprite(SPRITES.carrierBurning, 0, 0);

      // Animate ocean waves at bottom (y: 230..255) by shifting horizontal strips
      if (spriteCanvas) {
        for (let wy = 232; wy < 256; wy += 3) {
          const waveShift = Math.round(Math.sin(sceneFrame * 0.12 + wy * 0.4) * 2.5);
          ctx.drawImage(
            spriteCanvas,
            SPRITES.carrierBurning.x, SPRITES.carrierBurning.y + wy, 224, 3,
            waveShift, wy, 224, 3
          );
        }
      }

      // Flickering fire glow overlay on the carrier deck
      const flicker = 0.12 + Math.abs(Math.sin(sceneFrame * 0.35)) * 0.16;
      ctx.fillStyle = `rgba(255, 110, 0, ${flicker})`;
      ctx.fillRect(42, 145, 165, 62);

      // Spawn periodic explosions on the burning carrier
      if (sceneFrame % 16 === 0 && sceneFrame < 260) {
        const exX = 48 + Math.random() * 145;
        const exY = 148 + Math.random() * 58;
        spawnExplosion(exX, exY, 12 + Math.random() * 12);
        if (sceneFrame % 32 === 0) sfx.playExplosion(0.28, 0.11);
      }

      updateAndDrawParticles();
      ctx.restore();

      // Stage Clear Mission Telemetry Overlay
      if (sceneFrame > 35) {
        drawArcadeText('OFFENSIVE TARGET', 112, 36, '#ffcc00', '#000', 'center');
        drawArcadeText('KAGA DESTROYED!', 112, 50, '#ff3300', '#000', 'center');
      }

      if (sceneFrame > 85) {
        const targetRate = 96;
        if (displayedRate < targetRate && sceneFrame % 2 === 0) {
          displayedRate += 2;
          sfx.playTick();
        }
        drawArcadeText(`DESTRUCTION RATE  ${displayedRate}%`, 112, 74, '#ffffff', '#000', 'center');
      }

      if (sceneFrame > 155) {
        const targetBonus = 50000;
        if (displayedBonus < targetBonus) {
          displayedBonus = Math.min(targetBonus, displayedBonus + 1000);
          score += 1000;
          if (sceneFrame % 3 === 0) sfx.playTick();
        }
        drawArcadeText('STAGE CLEAR BONUS', 112, 94, '#00e5ff', '#000', 'center');
        drawArcadeText(`${displayedBonus} PTS`, 112, 108, '#ffcc00', '#000', 'center');
      }

      // Bonus mascot rhinos (authentic Capcom secret bonus icons!)
      if (sceneFrame > 200) {
        const rhinoFrame = Math.floor(sceneFrame / 8) % SPRITES.rhinos.length;
        for (let r = 0; r < 4; r++) {
          drawSprite(SPRITES.rhinos[(rhinoFrame + r) % 4], 68 + r * 22, 122);
        }
      }

      drawArcadeHUD();

      if (autoPlay && sceneFrame >= 360) {
        setScene(2, true);
      }
    }

    // =========================================================================
    // SCENE 2: GIANT BOMBER "AYAKO" CRASHING IN FLAMES
    // Uses bomberFalling panel + scrolling sky illusion + fire trails + P-38 escort
    // =========================================================================
    function renderScene2() {
      const shakeX = sceneFrame < 220 ? Math.sin(sceneFrame * 1.1) * 1.5 : 0;

      ctx.save();
      ctx.translate(Math.round(shakeX), 0);

      // Draw crashing Ayako heavy bomber panel
      drawSprite(SPRITES.bomberFalling, 0, 0);

      // Spawn fire & smoke bursts along the bomber's burning wings & fuselage
      if (sceneFrame % 12 === 0 && sceneFrame < 290) {
        const wingSpots = [
          { x: 96,  y: 66  },
          { x: 112, y: 120 },
          { x: 76,  y: 162 },
          { x: 158, y: 185 },
          { x: 138, y: 215 }
        ];
        const spot = wingSpots[Math.floor(Math.random() * wingSpots.length)];
        spawnExplosion(spot.x + (Math.random() - 0.5) * 14, spot.y + (Math.random() - 0.5) * 14, 14);
        if (sceneFrame % 24 === 0) sfx.playExplosion(0.25, 0.1);
      }

      updateAndDrawParticles();

      // Player's P-38 flies victorious past the falling bomber
      if (sceneFrame > 50 && sceneFrame < 230) {
        const pProgress = (sceneFrame - 50) / 180;
        const planeIdx = Math.min(6, Math.floor(pProgress * 7));
        const sp = SPRITES.planes[planeIdx];
        const px = 20 + pProgress * 145;
        const py = 215 - pProgress * 165;
        drawSprite(sp, px, py);
      }

      ctx.restore();

      // Overlay Telemetry
      if (sceneFrame > 30) {
        drawArcadeText('SPECIAL BOMBER', 112, 34, '#ffcc00', '#000', 'center');
        drawArcadeText('AYAKO SHOT DOWN!', 112, 48, '#ff3300', '#000', 'center');
      }

      if (sceneFrame > 95) {
        const targetRate = 100;
        if (displayedRate < targetRate && sceneFrame % 2 === 0) {
          displayedRate += 2;
          sfx.playTick();
        }
        drawArcadeText(`DESTRUCTION RATE ${displayedRate}%`, 112, 204, '#ffffff', '#000', 'center');
      }

      if (sceneFrame > 165) {
        const targetBonus = 80000;
        if (displayedBonus < targetBonus) {
          displayedBonus = Math.min(targetBonus, displayedBonus + 2000);
          score += 2000;
          if (sceneFrame % 3 === 0) sfx.playTick();
        }
        drawArcadeText(`SUPER BONUS ${displayedBonus}`, 112, 222, '#00ffff', '#000', 'center');
      }

      drawArcadeHUD();

      if (autoPlay && sceneFrame >= 360) {
        setScene(3, true);
      }
    }

    // =========================================================================
    // SCENE 3: FINAL VICTORY ENDING SEQUENCE (THE BATTLE OF MIDWAY WON)
    // Uses skyClouds + airfieldBase + animated waving US Flag + celebrating crew
    // + flyby P-38s + classic arcade congratulatory text & scrolling credits
    // =========================================================================
    function renderScene3() {
      // Top sky backdrop
      ctx.fillStyle = '#00a8f8';
      ctx.fillRect(0, 0, 224, 256);

      // Draw clouds in upper portion
      drawSprite(SPRITES.skyClouds, 0, -40);

      // Distant P-38 squadron flyby across the sky
      const flyX = ((sceneFrame * 0.9) % 280) - 40;
      drawSprite(SPRITES.planes[0], flyX, 92);
      drawSprite(SPRITES.planes[1], flyX - 28, 102);

      // Draw the Airfield Base tarmac at the bottom (224 x 112 -> placed at y=144)
      drawSprite(SPRITES.airfieldBase, 0, 144);

      // Animated Waving American Flag (4 frames in arcard.png)
      const flagIdx = Math.floor(sceneFrame / 7) % SPRITES.flags.length;
      drawSprite(SPRITES.flags[flagIdx], 20, 34);

      // Victory header next to flag
      drawArcadeText('MISSION', 148, 38, '#ffcc00', '#000', 'center');
      drawArcadeText('COMPLETE!', 148, 52, '#ffffff', '#000', 'center');

      // Animated Ground Crew / Mechanics celebrating on the tarmac!
      // 1) Crew running across the left tarmac
      const runnerX = 12 + ((sceneFrame * 0.85) % 88);
      const runFrame = Math.floor(sceneFrame / 5) % SPRITES.crewRunRight.length;
      drawSprite(SPRITES.crewRunRight[runFrame], runnerX, 232);

      // 2) Crew jumping for joy near the planes
      const jumpFrame = Math.floor(sceneFrame / 10) % SPRITES.crewJump.length;
      const jumpOffsetY = jumpFrame === 1 ? -4 : 0;
      drawSprite(SPRITES.crewJump[jumpFrame], 106, 228 + jumpOffsetY);
      drawSprite(SPRITES.crewJump[(jumpFrame + 1) % 2], 124, 230 - jumpOffsetY);

      // 3) Crew waving flags/arms on the right side
      const waveFrame = Math.floor(sceneFrame / 7) % SPRITES.crewWave.length;
      drawSprite(SPRITES.crewWave[waveFrame], 200, 231);

      // Victory message & Arcade Credits Roll
      const msgLines = [
        { text: 'CONGRATULATIONS!', color: '#ffcc00' },
        { text: 'THE BATTLE OF MIDWAY', color: '#ffffff' },
        { text: 'HAS ENDED IN OUR', color: '#ffffff' },
        { text: 'GLORIOUS VICTORY!', color: '#00ffff' },
        { text: '', color: '#fff' },
        { text: 'ALL ENEMY FLEETS', color: '#ff9900' },
        { text: 'HAVE BEEN SUNK.', color: '#ff9900' },
        { text: 'PEACE RETURNS TO', color: '#ffffff' },
        { text: 'THE PACIFIC OCEAN.', color: '#ffffff' },
        { text: '', color: '#fff' },
        { text: '- STAFF & CREDITS -', color: '#ffcc00' },
        { text: 'ORIGINAL GAME 1987', color: '#00e5ff' },
        { text: 'CAPCOM CO., LTD.', color: '#ffffff' },
        { text: '', color: '#fff' },
        { text: 'THANK YOU FOR PLAYING!', color: '#ffcc00' }
      ];

      // Clip a neat message window between y=78 and y=142
      ctx.save();
      ctx.beginPath();
      ctx.rect(8, 78, 208, 62);
      ctx.clip();

      const scrollY = 136 - (sceneFrame * 0.28);
      msgLines.forEach((line, idx) => {
        const ly = scrollY + idx * 13;
        if (ly > 66 && ly < 144 && line.text) {
          drawArcadeText(line.text, 112, ly, line.color, '#000000', 'center');
        }
      });
      ctx.restore();

      drawArcadeHUD();

      // Loop back to Scene 0 in Auto Movie mode after credits finish
      if (autoPlay && sceneFrame >= 760) {
        setScene(0, true);
      }
    }

    // --- Main 60FPS Arcade Loop ---
    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!assetsLoaded) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, 224, 256);
        drawArcadeText(loadError ? 'ERROR LOADING ARCARD.PNG' : 'LOADING ROM SPRITES...', 112, 120, '#ffcc00', '#000', 'center');
      } else {
        switch (currentScene) {
          case 0: renderScene0(); break;
          case 1: renderScene1(); break;
          case 2: renderScene2(); break;
          case 3: renderScene3(); break;
        }
        sceneFrame++;
        globalFrame++;
      }

      requestAnimationFrame(gameLoop);
    }

    // --- UI & Keyboard Event Listeners ---
    document.getElementById('btnAuto').addEventListener('click', () => {
      sfx.playCoin();
      setScene(0, true);
    });

    [0, 1, 2, 3].forEach(idx => {
      document.getElementById(`btnScene${idx}`).addEventListener('click', () => {
        sfx.playTick();
        setScene(idx, false);
      });
    });

    const btnSound = document.getElementById('btnSound');
    btnSound.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      btnSound.textContent = sfx.enabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
      if (sfx.enabled) sfx.playCoin();
    });

    const btnCrt = document.getElementById('btnCrt');
    const crtOverlay = document.getElementById('crtOverlay');
    btnCrt.addEventListener('click', () => {
      crtOverlay.classList.toggle('off');
      const isOff = crtOverlay.classList.contains('off');
      btnCrt.textContent = isOff ? '📺 CRT: OFF' : '📺 CRT: ON';
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
        e.preventDefault();
        sfx.playCoin();
        setScene(0, true);
      } else if (e.key === '1') {
        setScene(0, false);
      } else if (e.key === '2') {
        setScene(1, false);
      } else if (e.key === '3') {
        setScene(2, false);
      } else if (e.key === '4') {
        setScene(3, false);
      } else if (e.key === 'c' || e.key === 'C') {
        creditsCount = Math.min(99, creditsCount + 1);
        sfx.playCoin();
      } else if (e.key === 'm' || e.key === 'M') {
        btnSound.click();
      }
    });

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
