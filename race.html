<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SUPER MONACO GP ARCADE - RIVAL CARS RACING GAME</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    :root {
      --bg-dark: #070810;
      --neon-blue: #00e5ff;
      --neon-gold: #ffcc00;
      --neon-red: #ff2a2a;
      --neon-green: #00ff66;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 40%, #151c36 0%, #05060a 78%);
      color: #fff;
      font-family: 'Press Start 2P', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px;
      overflow-x: hidden;
    }

    .arcade-cabinet {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      max-width: 100%;
    }

    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      width: 100%;
      max-width: 820px;
      justify-content: space-between;
      align-items: center;
    }

    .nav-link {
      background: #141929;
      color: #8fa3cc;
      text-decoration: none;
      font-size: 8.5px;
      padding: 7px 11px;
      border: 2px solid #2e3b5e;
      border-radius: 6px;
      transition: 0.15s;
    }

    .nav-link:hover, .nav-link.active {
      background: #3d0c18;
      color: var(--neon-gold);
      border-color: var(--neon-red);
    }

    .marquee {
      background: linear-gradient(90deg, #0b1338 0%, #7d0c1e 50%, #0b1338 100%);
      border: 3px solid var(--neon-gold);
      border-radius: 8px;
      padding: 9px 20px;
      text-align: center;
      box-shadow: 0 0 22px rgba(255, 42, 42, 0.45), inset 0 0 12px rgba(0, 229, 255, 0.35);
      width: 100%;
      max-width: 820px;
    }

    .marquee h1 {
      font-size: 14px;
      color: var(--neon-gold);
      text-shadow: 2px 2px 0 #000, -1px -1px 0 var(--neon-red);
      letter-spacing: 2px;
      margin-bottom: 4px;
    }

    .marquee p {
      font-size: 8px;
      color: #a8e6ff;
      letter-spacing: 1px;
    }

    .crt-bezel {
      background: #121521;
      padding: 15px;
      border-radius: 20px;
      border: 4px solid #2a314a;
      box-shadow:
        0 18px 50px rgba(0, 0, 0, 0.9),
        0 0 35px rgba(0, 229, 255, 0.2),
        inset 0 0 18px #000;
    }

    .screen-container {
      position: relative;
      width: 780px;
      height: 540px;
      max-width: 92vw;
      max-height: 68vh;
      aspect-ratio: 384 / 264;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: inset 0 0 25px #000;
    }

    canvas {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }

    .crt-overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.32) 50%),
        radial-gradient(circle at center, transparent 68%, rgba(0, 0, 0, 0.58) 100%);
      background-size: 100% 4px, 100% 100%;
      z-index: 5;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .crt-overlay.off {
      opacity: 0;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      justify-content: center;
      align-items: center;
      background: #101420;
      border: 2px solid #283252;
      border-radius: 10px;
      padding: 9px 12px;
      width: 100%;
      max-width: 820px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.6);
    }

    .btn {
      background: #1c243b;
      color: #e0ecff;
      border: 2px solid #415385;
      border-bottom-width: 4px;
      border-radius: 6px;
      padding: 8px 10px;
      font-family: inherit;
      font-size: 8.5px;
      cursor: pointer;
      transition: all 0.1s;
      text-transform: uppercase;
    }

    .btn:hover {
      background: #283659;
      border-color: var(--neon-blue);
      color: var(--neon-blue);
    }

    .btn:active, .btn.active {
      transform: translateY(2px);
      border-bottom-width: 2px;
      background: #521020;
      border-color: var(--neon-gold);
      color: var(--neon-gold);
    }

    .status-hint {
      font-size: 8.5px;
      color: #93a6cc;
      text-align: center;
      line-height: 1.6;
    }

    .status-hint span {
      color: var(--neon-gold);
    }
  </style>
</head>
<body>

  <div class="arcade-cabinet">
    <div class="top-nav">
      <a href="index.html" class="nav-link">✈ 1943: MIDWAY CUTSCENE</a>
      <a href="rex.html" class="nav-link">🦖 T-REX (REXY) MOTION</a>
      <a href="race.html" class="nav-link active">🏎️ RIVAL CARS GRAND PRIX</a>
    </div>

    <div class="marquee">
      <h1>SUPER RIVAL GRAND PRIX - 16-BIT ARCADE RACER</h1>
      <p>CHOOSE YOUR F1 TEAM (RED / YELLOW / GREEN) &amp; BEAT THE RIVAL CARS!</p>
    </div>

    <div class="crt-bezel">
      <div class="screen-container">
        <canvas id="raceCanvas" width="384" height="264"></canvas>
        <div id="crtOverlay" class="crt-overlay"></div>
      </div>
    </div>

    <div class="controls">
      <button class="btn active" data-car="0" id="btnCar0">🔴 TEAM RED (BALANCED)</button>
      <button class="btn" data-car="1" id="btnCar1">🟡 TEAM YELLOW (TOP SPEED)</button>
      <button class="btn" data-car="2" id="btnCar2">🟢 TEAM GREEN (HANDLING)</button>
      <button class="btn" id="btnRestart">🏁 NEW RACE [R]</button>
      <button class="btn" id="btnSound">🔊 SFX: ON</button>
      <button class="btn" id="btnCrt">📺 CRT: ON</button>
    </div>

    <div class="status-hint">
      DRIVE: <span>[←/→ or A/D]</span> STEER &nbsp;|&nbsp; <span>[↑ or W]</span> GAS &nbsp;|&nbsp; <span>[↓ or S]</span> BRAKE &nbsp;|&nbsp; <span>[SPACE]</span> NITRO BOOST &nbsp;|&nbsp; <span>[1-3]</span> CHANGE CAR
    </div>
  </div>

  <script>
    // =========================================================================
    // SUPER RIVAL GRAND PRIX - PSEUDO-3D ARCADE RACING ENGINE
    // Uses Rival Cars.png (470 x 427)
    // 3 F1 Teams (RED, YELLOW, GREEN) x 2 Tire Animation Frames x 7 Steering Angles
    // =========================================================================

    const canvas = document.getElementById('raceCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // --- Exact Grid Coordinates from Rival Cars.png (470 x 427) ---
    // 7 Columns (steering from Hard Left -> Center -> Hard Right):
    // Col X starts: [2, 69, 136, 203, 270, 337, 404], width = 64
    // 6 Rows (2 tire-spin rows per color):
    // RED:    Row 0 (y=10, h=64), Row 1 (y=77, h=64)
    // YELLOW: Row 2 (y=152, h=64), Row 3 (y=219, h=64)
    // GREEN:  Row 4 (y=294, h=64), Row 5 (y=361, h=64)
    const COL_X = [2, 69, 136, 203, 270, 337, 404];
    const ROW_Y = [
      [10, 77],   // Team 0: RED
      [152, 219], // Team 1: YELLOW
      [294, 361]  // Team 2: GREEN
    ];

    const TEAM_INFO = [
      { name: 'SCUDERIA RED',    color: '#ff3333', maxSpeed: 312, accel: 1.05, grip: 1.02 },
      { name: 'THUNDER YELLOW',  color: '#ffd000', maxSpeed: 326, accel: 0.96, grip: 0.95 },
      { name: 'EMERALD GREEN',   color: '#00ff66', maxSpeed: 304, accel: 1.12, grip: 1.15 }
    ];

    // --- Load Rival Cars.png & Chroma-Key Cell Background RGB(77, 84, 117) ---
    let carSheet = null;
    let assetsLoaded = false;

    const rawCars = new Image();
    rawCars.onload = () => {
      const off = document.createElement('canvas');
      off.width = rawCars.width;
      off.height = rawCars.height;
      const octx = off.getContext('2d');
      octx.drawImage(rawCars, 0, 0);

      const imgData = octx.getImageData(0, 0, off.width, off.height);
      const d = imgData.data;

      // In Rival Cars.png:
      // Cell background is RGB(77, 84, 117)
      // Grid border lines are RGB(119, 129, 166) and RGB(72, 41, 112)
      for (let i = 0; i < d.length; i += 4) {
        const r = d[i], g = d[i + 1], b = d[i + 2];
        const isCellBg = (Math.abs(r - 77) <= 6 && Math.abs(g - 84) <= 6 && Math.abs(b - 117) <= 6);
        const isGridBorder = (Math.abs(r - 119) <= 5 && Math.abs(g - 129) <= 5 && Math.abs(b - 166) <= 5);
        const isHeaderBg = (Math.abs(r - 72) <= 6 && Math.abs(g - 41) <= 6 && Math.abs(b - 112) <= 6);
        if (isCellBg || isGridBorder || isHeaderBg) {
          d[i + 3] = 0;
        }
      }
      octx.putImageData(imgData, 0, 0);
      carSheet = off;
      assetsLoaded = true;
    };

    // Helper to draw a specific car sprite:
    // teamIdx: 0 (Red), 1 (Yellow), 2 (Green)
    // steerIdx: 0 (Hard Left) .. 3 (Center) .. 6 (Hard Right)
    // tireFrame: 0 or 1 (alternates rapidly with speed for spinning tires + exhaust vibration!)
    function drawCarSprite(teamIdx, steerIdx, tireFrame, cx, bottomY, scale = 1) {
      if (!carSheet) return;
      const clampedSteer = Math.max(0, Math.min(6, Math.round(steerIdx)));
      const sx = COL_X[clampedSteer];
      const sy = ROW_Y[teamIdx][tireFrame & 1];
      const sw = 64;
      const sh = 62;
      const dw = sw * scale;
      const dh = sh * scale;

      // Ground shadow under the F1 car
      ctx.save();
      ctx.fillStyle = 'rgba(0, 0, 0, 0.48)';
      ctx.beginPath();
      ctx.ellipse(cx, bottomY - 3 * scale, dw * 0.44, Math.max(2, 5 * scale), 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.drawImage(
        carSheet,
        sx, sy, sw, sh,
        Math.round(cx - dw / 2),
        Math.round(bottomY - dh),
        Math.round(dw),
        Math.round(dh)
      );
      ctx.restore();
    }

    // --- Web Audio F1 Engine & Arcade Sound Synthesizer ---
    class RacingAudio {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playBeep(freq = 523.25, duration = 0.18, type = 'square', vol = 0.1) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, now);
        gain.gain.setValueAtTime(vol, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + duration);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + duration);
      }

      playEnginePulse(speedRatio, isBoosting) {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = isBoosting ? 'sawtooth' : 'triangle';
        const baseFreq = 58 + speedRatio * 195 + (isBoosting ? 55 : 0);
        osc.frequency.setValueAtTime(baseFreq, now);
        gain.gain.setValueAtTime(0.025, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.06);
      }

      playTireScreech() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(640 + Math.random() * 140, now);
        gain.gain.setValueAtTime(0.03, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.07);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.07);
      }

      playCrash() {
        if (!this.enabled) return;
        this.init();
        if (!this.ctx) return;
        const dur = 0.25;
        const bufSize = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;
        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + dur);
        noise.connect(gain);
        gain.connect(this.ctx.destination);
        noise.start();
      }

      playVictory() {
        const notes = [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5];
        notes.forEach((f, idx) => {
          setTimeout(() => this.playBeep(f, idx === 5 ? 0.45 : 0.14, 'square', 0.1), idx * 140);
        });
      }
    }

    const sfx = new RacingAudio();

    // --- Track & Pseudo-3D Road Configuration ---
    const TOTAL_LAPS = 3;
    const TRACK_LENGTH = 3600; // units per lap
    const SEGMENTS = [];
    const NUM_SEGMENTS = 360; // each segment = 10 track units

    // Build a Grand Prix circuit with straights, chicanes, sweeping S-curves & hairpins
    for (let i = 0; i < NUM_SEGMENTS; i++) {
      let curve = 0;
      if (i > 25 && i < 65) curve = 2.2;          // Right sweeper
      else if (i > 85 && i < 120) curve = -2.8;   // Left hairpin
      else if (i > 140 && i < 165) curve = 1.8;   // Chicane right
      else if (i >= 165 && i < 190) curve = -1.8; // Chicane left
      else if (i > 215 && i < 265) curve = 3.2;   // High-speed right bend
      else if (i > 290 && i < 330) curve = -2.4;  // Final corner left
      SEGMENTS.push({ curve });
    }

    // --- Game State & Entities ---
    const keys = { left: false, right: false, up: false, down: false, boost: false };

    let player = {
      team: 0,          // 0=RED, 1=YELLOW, 2=GREEN
      x: 0,             // -1 (left edge) to +1 (right edge)
      z: 0,             // distance along track
      speed: 0,         // 0 .. 350 km/h
      steerAnim: 3,     // 0..6 sprite column
      tireTick: 0,
      lap: 1,
      lapTime: 0,
      bestLap: null,
      totalTime: 0,
      nitro: 100,
      boosting: false,
      rank: 10,
      finished: false
    };

    let rivals = [];
    let sparks = [];
    let countdown = 180; // 3..2..1..GO! (at 60fps)
    let skyOffset = 0;
    let screenShake = 0;

    function initRace(selectedTeam = player.team) {
      player.team = selectedTeam;
      player.x = 0;
      player.z = 0;
      player.speed = 0;
      player.steerAnim = 3;
      player.tireTick = 0;
      player.lap = 1;
      player.lapTime = 0;
      player.totalTime = 0;
      player.nitro = 100;
      player.boosting = false;
      player.finished = false;
      countdown = 180;
      sparks = [];

      // Create 9 Rival F1 Cars using the other teams & all 3 colors from Rival Cars.png
      rivals = [];
      const rivalNames = [
        'SENNA', 'PROST', 'MANSELL', 'PIQUET', 'ALESI',
        'BERGER', 'PATRESE', 'BOUTSEN', 'NANNI'
      ];
      for (let i = 0; i < 9; i++) {
        const rivalTeam = (selectedTeam + 1 + (i % 3)) % 3;
        rivals.push({
          name: rivalNames[i],
          team: rivalTeam,
          x: (i % 2 === 0 ? -0.42 : 0.42) + (Math.random() - 0.5) * 0.15,
          z: 90 + i * 115, // staggered starting grid ahead of player
          speed: 0,
          baseMaxSpeed: 235 + i * 7.5,
          steerAnim: 3,
          tireTick: i * 3,
          targetLane: (Math.random() * 1.3) - 0.65
        });
      }
    }

    initRace(0);

    // --- Pixel Text Helper ---
    function drawText(txt, x, y, color = '#ffffff', shadow = '#000000', align = 'left', size = 8) {
      ctx.save();
      ctx.font = `${size}px "Press Start 2P", monospace`;
      ctx.textAlign = align;
      ctx.textBaseline = 'top';
      if (shadow) {
        ctx.fillStyle = shadow;
        ctx.fillText(txt, Math.round(x) + 1, Math.round(y) + 1);
      }
      ctx.fillStyle = color;
      ctx.fillText(txt, Math.round(x), Math.round(y));
      ctx.restore();
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = Math.floor(sec % 60);
      const ms = Math.floor((sec % 1) * 100);
      return `${m}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function spawnSparks(x, y, count = 8, color1 = '#ffff00', color2 = '#ff5500') {
      for (let i = 0; i < count; i++) {
        sparks.push({
          x: x + (Math.random() - 0.5) * 20,
          y: y + (Math.random() - 0.5) * 8,
          vx: (Math.random() - 0.5) * 5,
          vy: -1 - Math.random() * 3.5,
          age: 0,
          life: 12 + Math.random() * 10,
          color: i % 2 === 0 ? color1 : color2
        });
      }
    }

    // --- Physics & AI Update ---
    function updateRace() {
      // Handle 3..2..1..GO Countdown
      if (countdown > 0) {
        if (countdown === 179 || countdown === 120 || countdown === 60) {
          sfx.playBeep(440, 0.16, 'square', 0.1);
        }
        countdown--;
        if (countdown === 0) {
          sfx.playBeep(880, 0.35, 'square', 0.14);
        }
        return;
      }

      const teamSpec = TEAM_INFO[player.team];
      const dt = 1 / 60;

      if (!player.finished) {
        player.lapTime += dt;
        player.totalTime += dt;
      }

      // Nitro Boost handling
      player.boosting = false;
      if (keys.boost && player.nitro > 0.5 && player.speed > 100 && !player.finished) {
        player.boosting = true;
        player.nitro = Math.max(0, player.nitro - 0.42);
      } else if (!keys.boost && player.nitro < 100) {
        player.nitro = Math.min(100, player.nitro + 0.08);
      }

      const topSpeed = teamSpec.maxSpeed + (player.boosting ? 38 : 0);

      // Throttle & Braking
      if (player.finished) {
        player.speed *= 0.985;
      } else if (keys.up) {
        player.speed += (1.65 * teamSpec.accel) * (1 - player.speed / (topSpeed + 40));
      } else if (keys.down) {
        player.speed -= 4.2;
      } else {
        player.speed -= 0.95;
      }

      // Off-road grass slowdown (|x| > 1.0)
      if (Math.abs(player.x) > 1.02 && player.speed > 110) {
        player.speed -= 2.8;
        screenShake = 2.5;
        if (Math.random() < 0.35) {
          spawnSparks(192 + (Math.random() - 0.5) * 44, 244, 2, '#55aa44', '#886633');
        }
      }

      player.speed = Math.max(0, Math.min(topSpeed, player.speed));

      // Advance player along track
      const moveStep = (player.speed / 300) * 7.2;
      const prevZ = player.z;
      player.z += moveStep;

      // Check Lap completion
      const curLap = Math.floor(player.z / TRACK_LENGTH) + 1;
      if (curLap > player.lap && !player.finished) {
        if (!player.bestLap || player.lapTime < player.bestLap) {
          player.bestLap = player.lapTime;
        }
        player.lapTime = 0;
        if (curLap > TOTAL_LAPS) {
          player.finished = true;
          sfx.playVictory();
        } else {
          player.lap = curLap;
          sfx.playBeep(783.99, 0.25, 'square', 0.12);
        }
      }

      // Current track segment curvature
      const segIdx = Math.floor((player.z / 10) % NUM_SEGMENTS);
      const curCurve = SEGMENTS[segIdx].curve;

      // Centrifugal force pushes player outward on curves
      const speedRatio = player.speed / 300;
      player.x -= (curCurve * 0.0115 * speedRatio) / teamSpec.grip;

      // Player steering input & mapping to the 7 sprite angles (0..6)
      let steerTarget = 3; // Center sprite
      if (!player.finished) {
        if (keys.left) {
          player.x -= 0.036 * teamSpec.grip * Math.min(1, speedRatio + 0.25);
          steerTarget = curCurve < -1.5 ? 0 : (keys.left ? 1 : 2);
          if (Math.abs(curCurve) > 2.0 && player.speed > 240 && Math.random() < 0.25) {
            sfx.playTireScreech();
          }
        } else if (keys.right) {
          player.x += 0.036 * teamSpec.grip * Math.min(1, speedRatio + 0.25);
          steerTarget = curCurve > 1.5 ? 6 : (keys.right ? 5 : 4);
          if (Math.abs(curCurve) > 2.0 && player.speed > 240 && Math.random() < 0.25) {
            sfx.playTireScreech();
          }
        } else {
          // Subtle counter-lean on strong curves even when not pressing keys
          if (curCurve < -1.8 && player.speed > 150) steerTarget = 2;
          else if (curCurve > 1.8 && player.speed > 150) steerTarget = 4;
        }
      }

      // Smoothly interpolate steering sprite index (0..6) for fluid 7-angle animation!
      if (keys.left && Math.abs(player.steerAnim - 0) > 0.1) {
        player.steerAnim = Math.max(0, player.steerAnim - 0.35);
      } else if (keys.right && Math.abs(player.steerAnim - 6) > 0.1) {
        player.steerAnim = Math.min(6, player.steerAnim + 0.35);
      } else {
        player.steerAnim += (steerTarget - player.steerAnim) * 0.28;
      }

      player.x = Math.max(-1.65, Math.min(1.65, player.x));

      // Parallax horizon scroll
      skyOffset = (skyOffset + curCurve * speedRatio * 1.8) % 384;

      // Spin tires based on speed
      if (player.speed > 5) {
        player.tireTick += speedRatio * 1.4;
        if (Math.floor(player.tireTick) % 3 === 0) {
          sfx.playEnginePulse(speedRatio, player.boosting);
        }
      }

      // Exhaust nitro flames when boosting
      if (player.boosting) {
        spawnSparks(192, 245, 2, '#00e5ff', '#ffcc00');
      }

      // --- Update AI Rival Cars ---
      let aheadCount = 0;
      rivals.forEach((rv, idx) => {
        // AI Rubber-banding so the race stays intense and fun
        const distDiff = rv.z - player.z;
        let targetSpd = rv.baseMaxSpeed;
        if (distDiff < -250) targetSpd += 35; // catch up slightly if far behind
        else if (distDiff > 650) targetSpd -= 22;

        rv.speed += (targetSpd - rv.speed) * 0.04;
        rv.z += (rv.speed / 300) * 7.2;
        rv.tireTick += (rv.speed / 300) * 1.2;

        // AI steering along track curves + lane weaving
        const rvSegIdx = Math.floor((rv.z / 10) % NUM_SEGMENTS);
        const rvCurve = SEGMENTS[rvSegIdx].curve;

        if (Math.random() < 0.015) {
          rv.targetLane = (Math.random() * 1.36) - 0.68;
        }
        const dx = rv.targetLane - rv.x;
        rv.x += Math.sign(dx) * Math.min(Math.abs(dx), 0.012);

        // Choose which of the 7 steering sprites the Rival Car displays!
        // Combine curve direction and lane-change direction for authentic banking look
        let rvSteer = 3;
        const turnSignal = -rvCurve * 0.8 + dx * 6;
        if (turnSignal < -2.2) rvSteer = 0;
        else if (turnSignal < -1.1) rvSteer = 1;
        else if (turnSignal < -0.35) rvSteer = 2;
        else if (turnSignal > 2.2) rvSteer = 6;
        else if (turnSignal > 1.1) rvSteer = 5;
        else if (turnSignal > 0.35) rvSteer = 4;
        rv.steerAnim = rvSteer;

        // Collision check between Player and Rival Car
        const relZ = rv.z - player.z;
        if (relZ > 6 && relZ < 32 && Math.abs(rv.x - player.x) < 0.34) {
          // Bump!
          player.speed = Math.max(90, rv.speed - 28);
          const pushDir = player.x >= rv.x ? 1 : -1;
          player.x += pushDir * 0.14;
          rv.x -= pushDir * 0.10;
          screenShake = 7;
          sfx.playCrash();
          spawnSparks(192 + (rv.x - player.x) * 80, 220, 14, '#ffff00', '#ff3300');
        }

        if (rv.z > player.z) aheadCount++;
      });

      player.rank = 1 + aheadCount;
    }

    // --- Render Pseudo-3D Horizon, Road & Rival Cars ---
    const HORIZON_Y = 112;
    const ROAD_H = 152; // from y=112 down to y=264

    function renderRace() {
      // 1. Sky & Grand Prix Horizon
      const skyGrad = ctx.createLinearGradient(0, 0, 0, HORIZON_Y);
      skyGrad.addColorStop(0, '#091538');
      skyGrad.addColorStop(0.55, '#1d4487');
      skyGrad.addColorStop(1, '#5ca0d3');
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, 384, HORIZON_Y);

      // Parallax Distant Mountains & Grandstands
      ctx.fillStyle = '#182b49';
      for (let i = -1; i < 8; i++) {
        const mx = ((i * 64 - skyOffset * 0.4) % 448 + 448) % 448 - 64;
        const mh = 22 + (i % 3) * 9;
        ctx.beginPath();
        ctx.moveTo(mx, HORIZON_Y);
        ctx.lineTo(mx + 32, HORIZON_Y - mh);
        ctx.lineTo(mx + 64, HORIZON_Y);
        ctx.fill();
      }

      // Grandstand banner strip along horizon
      ctx.fillStyle = '#d9dce6';
      ctx.fillRect(0, HORIZON_Y - 6, 384, 6);
      for (let bx = 0; bx < 384; bx += 16) {
        ctx.fillStyle = ((bx + Math.floor(skyOffset)) % 32 < 16) ? '#cc1122' : '#0044aa';
        ctx.fillRect(bx, HORIZON_Y - 5, 10, 4);
      }

      // 2. Scanline Pseudo-3D Road Projection (from bottom y=263 up to HORIZON_Y=112)
      const baseSegIdx = Math.floor(player.z / 10);
      let curveAccum = 0;
      let curveOffset = 0;

      // Store projected road center X per depth Z so Rival Cars align accurately with curves
      const roadCenterByRow = new Array(ROAD_H);

      for (let row = 0; row < ROAD_H; row++) {
        const screenY = 263 - row;
        // Perspective depth: row=0 is closest (zDist=8), row=ROAD_H-1 is far horizon (zDist=360)
        const perspective = row / ROAD_H; // 0 (bottom) -> 1 (horizon)
        const zDist = 8 / (1.02 - perspective * 0.94);

        const segIdx = (baseSegIdx + Math.floor(zDist / 10)) % NUM_SEGMENTS;
        const segCurve = SEGMENTS[segIdx].curve;

        curveAccum += segCurve * 0.015;
        curveOffset += curveAccum * perspective * 0.85;

        const roadHalfWidth = (1 - perspective * 0.82) * 165;
        const playerShift = player.x * (1 - perspective * 0.85) * 145;
        const centerX = 192 - playerShift + curveOffset;

        roadCenterByRow[row] = { centerX, roadHalfWidth, zDist };

        // Alternating rumble strip & grass color bands
        const stripePhase = Math.floor((player.z + zDist) / 14) % 2;
        const isStartFinishLine = ((player.z + zDist) % TRACK_LENGTH) < 18;

        // Grass
        ctx.fillStyle = stripePhase === 0 ? '#126b24' : '#0e571d';
        ctx.fillRect(0, screenY, 384, 1);

        // Red/White Curbs (Rumble strips)
        const curbW = Math.max(2, roadHalfWidth * 0.13);
        ctx.fillStyle = stripePhase === 0 ? '#ee2222' : '#ffffff';
        ctx.fillRect(centerX - roadHalfWidth - curbW, screenY, roadHalfWidth * 2 + curbW * 2, 1);

        // Asphalt Road Surface
        if (isStartFinishLine) {
          ctx.fillStyle = stripePhase === 0 ? '#ffffff' : '#222222';
        } else {
          ctx.fillStyle = stripePhase === 0 ? '#454954' : '#3d414b';
        }
        ctx.fillRect(centerX - roadHalfWidth, screenY, roadHalfWidth * 2, 1);

        // Lane Center Dashed Line
        if (stripePhase === 0 && !isStartFinishLine) {
          const laneW = Math.max(1, roadHalfWidth * 0.035);
          ctx.fillStyle = '#e0e6f0';
          ctx.fillRect(centerX - laneW / 2, screenY, laneW, 1);
        }
      }

      // 3. Draw Rival F1 Cars (Sorted Back-to-Front by distance)
      const visibleRivals = [];
      rivals.forEach(rv => {
        const relZ = rv.z - player.z;
        if (relZ > 4 && relZ < 320) {
          visibleRivals.push({ rv, relZ });
        }
      });

      visibleRivals.sort((a, b) => b.relZ - a.relZ);

      visibleRivals.forEach(({ rv, relZ }) => {
        // Find matching scanline row for this rival's relZ
        let bestRow = 0;
        let minDiff = 9999;
        for (let r = 0; r < ROAD_H; r++) {
          const diff = Math.abs(roadCenterByRow[r].zDist - relZ);
          if (diff < minDiff) {
            minDiff = diff;
            bestRow = r;
          }
        }

        const proj = roadCenterByRow[bestRow];
        const screenY = 263 - bestRow;
        const scale = Math.max(0.18, Math.min(1.35, (proj.roadHalfWidth / 165) * 1.42));
        const screenX = proj.centerX + rv.x * proj.roadHalfWidth * 0.85;

        drawCarSprite(
          rv.team,
          rv.steerAnim,
          Math.floor(rv.tireTick),
          screenX,
          screenY,
          scale
        );

        // Draw rival driver tag when close!
        if (relZ < 95) {
          drawText(rv.name, screenX, screenY - 66 * scale - 9, '#ffd000', '#000', 'center', 6);
        }
      });

      // 4. Draw Player's F1 Car in Foreground (using all 7 steering angles + 2-frame tire animation!)
      const bounceY = player.speed > 5 ? (Math.floor(player.tireTick) % 2) : 0;
      drawCarSprite(
        player.team,
        Math.round(player.steerAnim),
        Math.floor(player.tireTick),
        192,
        255 + bounceY,
        1.45
      );

      // 5. Render Sparks & Nitro Flames
      for (let i = sparks.length - 1; i >= 0; i--) {
        const sp = sparks[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.age++;
        if (sp.age >= sp.life) {
          sparks.splice(i, 1);
          continue;
        }
        ctx.fillStyle = sp.color;
        ctx.fillRect(Math.round(sp.x), Math.round(sp.y), 3, 3);
      }

      // 6. Draw Arcade Racing HUD
      drawRacingHUD();
    }

    function drawRacingHUD() {
      // Top dark translucent HUD bar
      ctx.fillStyle = 'rgba(8, 12, 24, 0.82)';
      ctx.fillRect(0, 0, 384, 34);
      ctx.fillStyle = '#2e406e';
      ctx.fillRect(0, 34, 384, 2);

      // POSITION
      drawText('POS', 10, 5, '#00e5ff', '#000', 'left', 7);
      const posSuffix = player.rank === 1 ? 'ST' : (player.rank === 2 ? 'ND' : (player.rank === 3 ? 'RD' : 'TH'));
      drawText(`${player.rank}${posSuffix}/10`, 10, 17, player.rank <= 3 ? '#ffcc00' : '#ffffff', '#000', 'left', 9);

      // SPEEDOMETER
      drawText('SPEED', 96, 5, '#00e5ff', '#000', 'left', 7);
      const spdColor = player.boosting ? '#00ff66' : (player.speed > 290 ? '#ff3333' : '#ffcc00');
      drawText(`${String(Math.round(player.speed)).padStart(3, '0')} KM/H`, 96, 17, spdColor, '#000', 'left', 9);

      // LAP COUNTER
      drawText('LAP', 214, 5, '#00e5ff', '#000', 'left', 7);
      drawText(`${player.lap}/${TOTAL_LAPS}`, 214, 17, '#ffffff', '#000', 'left', 9);

      // LAP TIME
      drawText('TIME', 278, 5, '#00e5ff', '#000', 'left', 7);
      drawText(formatTime(player.lapTime), 278, 17, '#ffffff', '#000', 'left', 9);

      // NITRO BOOST BAR (Top Right under header)
      ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
      ctx.fillRect(10, 42, 92, 10);
      ctx.strokeStyle = '#00e5ff';
      ctx.strokeRect(10, 42, 92, 10);
      ctx.fillStyle = player.boosting ? '#00ff66' : '#ff9900';
      ctx.fillRect(12, 44, Math.round((player.nitro / 100) * 88), 6);
      drawText('NITRO [SPACE]', 108, 43, '#ffd000', '#000', 'left', 6);

      // Team Badge on top right
      const tInfo = TEAM_INFO[player.team];
      drawText(tInfo.name, 374, 43, tInfo.color, '#000', 'right', 6);

      // Countdown Overlay
      if (countdown > 0) {
        const sec = Math.ceil(countdown / 60);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
        ctx.fillRect(112, 85, 160, 56);
        ctx.strokeStyle = '#ffcc00';
        ctx.strokeRect(112, 85, 160, 56);
        drawText('GET READY!', 192, 95, '#00e5ff', '#000', 'center', 8);
        drawText(String(sec), 192, 114, '#ff3333', '#000', 'center', 18);
      }

      // Finish Checkered Flag Overlay
      if (player.finished) {
        ctx.fillStyle = 'rgba(6, 10, 22, 0.85)';
        ctx.fillRect(42, 68, 300, 110);
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 2;
        ctx.strokeRect(42, 68, 300, 110);

        drawText('🏁 GOAL! RACE COMPLETE! 🏁', 192, 80, '#ffcc00', '#000', 'center', 9);
        drawText(`FINAL RANK: ${player.rank} / 10`, 192, 102, '#00ff66', '#000', 'center', 9);
        drawText(`TOTAL TIME: ${formatTime(player.totalTime)}`, 192, 122, '#ffffff', '#000', 'center', 8);
        if (player.bestLap) {
          drawText(`BEST LAP:   ${formatTime(player.bestLap)}`, 192, 138, '#00e5ff', '#000', 'center', 8);
        }
        drawText('PRESS [R] FOR NEXT GRAND PRIX', 192, 158, '#ff9900', '#000', 'center', 7);
      }
    }

    // --- Main 60FPS Game Loop ---
    function loop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!assetsLoaded) {
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        drawText('LOADING RIVAL CARS SPRITE ROM...', 192, 125, '#ffcc00', '#000', 'center', 8);
      } else {
        updateRace();

        ctx.save();
        if (screenShake > 0.2) {
          ctx.translate(
            Math.round((Math.random() - 0.5) * screenShake * 2),
            Math.round((Math.random() - 0.5) * screenShake * 2)
          );
          screenShake *= 0.85;
        }
        renderRace();
        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    // --- Controls & Event Listeners ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
      if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); keys.up = true; }
      if (e.code === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); keys.down = true; }
      if (e.code === 'Space') { e.preventDefault(); keys.boost = true; }

      if (e.key === 'r' || e.key === 'R') {
        initRace(player.team);
      } else if (e.key === '1') {
        selectTeam(0);
      } else if (e.key === '2') {
        selectTeam(1);
      } else if (e.key === '3') {
        selectTeam(2);
      }
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
      if (e.code === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
      if (e.code === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.up = false;
      if (e.code === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.down = false;
      if (e.code === 'Space') keys.boost = false;
    });

    function selectTeam(teamIdx) {
      player.team = teamIdx;
      document.querySelectorAll('.controls .btn[data-car]').forEach(b => {
        b.classList.toggle('active', Number(b.getAttribute('data-car')) === teamIdx);
      });
      sfx.playBeep(659.25, 0.12, 'square', 0.1);
    }

    document.querySelectorAll('.controls .btn[data-car]').forEach(btn => {
      btn.addEventListener('click', () => {
        selectTeam(Number(btn.getAttribute('data-car')));
      });
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      initRace(player.team);
    });

    const btnSound = document.getElementById('btnSound');
    btnSound.addEventListener('click', () => {
      sfx.enabled = !sfx.enabled;
      btnSound.textContent = sfx.enabled ? '🔊 SFX: ON' : '🔇 SFX: OFF';
    });

    const btnCrt = document.getElementById('btnCrt');
    const crtOverlay = document.getElementById('crtOverlay');
    btnCrt.addEventListener('click', () => {
      crtOverlay.classList.toggle('off');
      btnCrt.textContent = crtOverlay.classList.contains('off') ? '📺 CRT: OFF' : '📺 CRT: ON';
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
